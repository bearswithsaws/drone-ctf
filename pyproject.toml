[project]
name = "drone-ctf-agent"
version = "0.1.0"
description = "Autonomous competitive client for the Drone Battles game"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-socketio>=5.11",
    "aiohttp>=3.9",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
drone-agent = "agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: talks to a live/private game server (not run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
