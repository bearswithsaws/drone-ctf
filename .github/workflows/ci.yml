name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (network-free)
        run: pytest
      - name: Replay ingest regression
        run: tools/replay tests/fixtures/replay_session.jsonl --expected tests/fixtures/replay_expected.json

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/contract/package-lock.json
      - name: Install Python contract dependencies
        run: pip install -e .
      - name: Install TypeScript contract dependencies
        run: npm ci --prefix packages/contract
      - name: Check contract schema and build package
        run: npm run check --prefix packages/contract
